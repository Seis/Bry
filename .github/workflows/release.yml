name: Publish release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v1.0.0." >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up latest Java 17 update
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: maven

      - name: Build release and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress "-Drevision=${RELEASE_TAG#v}" clean verify

      - name: Prepare release files
        run: bash .github/scripts/prepare-distribution.sh

      - name: Publish standalone executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(target/distribution/bry.jar target/distribution/RUNNING.txt target/distribution/SHA256SUMS)
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing release file: $asset." >&2
              exit 1
            fi
          done
          (cd target/distribution && sha256sum -c SHA256SUMS)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Complete a Release created through GitHub's UI with only source archives.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "BRy $RELEASE_TAG" --generate-notes "${assets[@]}"
          fi

          uploaded=$(gh release view "$RELEASE_TAG" --json assets \
            --jq '[.assets[].name] | contains(["bry.jar", "RUNNING.txt", "SHA256SUMS"])')
          if [[ "$uploaded" != true ]]; then
            echo "Release publication is incomplete: executable JAR, instructions or checksums are missing." >&2
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-${{ env.RELEASE_TAG }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
