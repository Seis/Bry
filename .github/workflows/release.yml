name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v1.0.0." >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up latest Java 17 update
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: maven

      - name: Build release and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress "-Drevision=${RELEASE_TAG#v}" clean verify

      - name: Prepare release files
        run: bash .github/scripts/prepare-distribution.sh

      - name: Publish standalone executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "BRy $RELEASE_TAG" --generate-notes \
            target/distribution/bry.jar \
            target/distribution/RUNNING.txt \
            target/distribution/SHA256SUMS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-${{ github.ref_name }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
